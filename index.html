<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityApp Quick Scaffold</title>
  <style>
    :root { font-family: Inter, system-ui, Arial, sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0ea5e9, #6366f1); display:flex; align-items:center; justify-content:center; }
    .card { width:min(880px, 92vw); background: rgba(255,255,255,0.9); color:#0f172a; border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,.25); padding:28px; }
    h1 { margin:0 0 8px; font-size: 2rem; }
    p { margin:0 0 20px; color:#334155; }
    .grid { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; }
    .city { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; }
    .city h3 { margin:0; font-size:1rem; }
    .city small { color:#64748b; }
    .toolbar{display:flex; gap:10px; margin-top:18px;}
    input{flex:1; padding:10px 12px; border-radius:10px; border:1px solid #cbd5e1;}
    button{padding:10px 14px; border:0; border-radius:10px; background:#4f46e5; color:#fff; font-weight:600;}
  </style>
</head>
<body>
  <main class="card">
    <h1>CityApp Dashboard</h1>
    <p>Quick scaffold: search and pin your favorite cities.</p>
    <section class="grid" id="cities"></section>
    <div class="toolbar">
      <input id="cityInput" placeholder="Add a city e.g. Chicago" />
      <button id="addBtn">Add city</button>
    </div>
  </main>
  <script>
    const seeded = [
      {name:'New York', note:'Population: 8.3M'},
      {name:'Los Angeles', note:'Population: 3.8M'},
      {name:'San Francisco', note:'Population: 0.8M'}
    ];
    const citiesEl = document.getElementById('cities');
    const input = document.getElementById('cityInput');
    function render(list){
      citiesEl.innerHTML = list.map(c => `<article class="city"><h3>${c.name}</h3><small>${c.note}</small></article>`).join('');
    }
    render(seeded);
    document.getElementById('addBtn').addEventListener('click', () => {
      const name = input.value.trim();
      if(!name) return;
      seeded.push({name, note:'Newly added'});
      input.value='';
      render(seeded);
    });
  </script>
</body>
</html>
